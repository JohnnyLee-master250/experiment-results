<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>实验总览 · Kernel Research</title>
  <link rel="stylesheet" href="../dashboard.css">
  <script src="../dashboard.js" defer></script>
</head>
<body data-root="../">
  <header class="top"><div class="wrap top-inner">
    <a class="archive-link" href="../archive/"><span aria-hidden="true">↖</span> 旧版归档</a>
    <span class="brand"><i class="brand-icon" aria-hidden="true"></i>Kernel Research</span>
    <a class="api" href="../api/v1/index.json">JSON API <span aria-hidden="true">↗</span></a>
  </div></header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div><h1 id="title">实验总览</h1><p>Ascend 910C 内核优化实验</p></div>
      <dl class="metrics"><div><dt>测试集</dt><dd id="dataset-count">—</dd></div><div><dt>模型</dt><dd id="model-count">—</dd></div><div><dt>结果记录</dt><dd id="result-count">—</dd></div></dl>
    </section>
    <section aria-labelledby="matrix-title">
      <div class="section-head"><h2 id="matrix-title">测试集与模型</h2><span class="status" id="result-status" role="status">读取中</span></div>
      <div class="tools"><div class="filters" role="group" aria-label="实验类别" id="filters"></div>
        <label class="search"><span class="lens" aria-hidden="true"></span><input id="query" type="search" placeholder="搜索测试集" aria-label="搜索测试集"></label>
      </div>
      <div class="panel"><div class="scroller"><table><caption class="sr">各测试集在三个模型下的实验结果</caption><thead><tr id="columns"><th scope="col">测试集</th><th scope="col">实验类别</th></tr></thead><tbody id="rows"></tbody></table></div>
      <p id="empty" role="status" hidden>没有匹配的测试集。</p>
      <div class="panel-foot"><span id="visible-count"></span><span>— &nbsp; 尚无结果</span></div></div>
    </section>
  </main>
</body></html>
